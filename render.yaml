# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Render Blueprint: one project + one web service.
#
# Before deploying a fork, namespace resources:
#   Actions → "Setup attendee Blueprint names" → Run workflow
#   or: npm run setup -- your-github-username
# That sets the project to {username}-cyc-workshop.
# Then deploy from the Dashboard (New → Blueprint) or CLI.

projects:
  # After setup: {username}-cyc-workshop
  - name: santoshreddy369-cyc-workshop
    environments:
      - name: production
        services:
          - type: web
            name: santoshreddy369-stock-research-agent-starter
            runtime: node
            plan: starter
            buildCommand: npm install
            startCommand: npm start
            healthCheckPath: /healthz
            envVars:
              - key: NODE_VERSION
                value: "20"
              # Delay so you can close the tab mid-run in the tutorial.
              - key: RESEARCH_DELAY_MS
                value: "8000"
